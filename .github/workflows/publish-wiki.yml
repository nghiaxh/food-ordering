name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - wiki/**
      - .github/workflows/publish-wiki.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    name: Publish wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Mirror thu muc wiki/ sang repo <owner>/<repo>.wiki.git.
      # Cung repo nen github.token + contents: write du quyen; khac repo phai dung PAT.
      - uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: wiki
