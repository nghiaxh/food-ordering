name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  server:
    name: Server Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_NAME: food_ordering_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-jwt-secret-longer-than-thirty-two-chars
      JWT_EXPIRATION_MS: '86400000'
      AI_API_KEYS: ''
      AI_MODELS: ''
      EMBEDDING_MODELS: ''
      ORDER_PAYMENT_TIMEOUT_MINUTES: '30'
      BASE_URL: http://localhost:5173
      API_URL: http://localhost:8080/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install client and Playwright browser
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start dev stack
        run: docker compose --profile dev up --build -d --wait --wait-timeout 180
      - name: Wait for services
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/categories > /dev/null &&
               curl --fail --silent http://localhost:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Dev stack did not become ready"
          docker compose --profile dev ps
          exit 1
      - name: Run E2E tests
        working-directory: client
        run: npm run test:e2e
      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose --profile dev ps
          docker compose --profile dev logs --tail=100
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: ignore
      - name: Stop dev stack
        if: always()
        run: docker compose --profile dev down -v --remove-orphans
