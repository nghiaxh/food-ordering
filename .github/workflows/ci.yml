name: Build, Test & E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test --if-present
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  server:
    name: Server (tests + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp test
      - run: mvn -B -ntp package -DskipTests
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: server-jar
          path: server/target/*.jar
          retention-days: 7

  e2e:
    name: E2E (Playwright, dev stack)
    runs-on: ubuntu-latest
    needs: [client, server]
    steps:
      - uses: actions/checkout@v4

      - name: Install client deps
        if: hashFiles('client/playwright.config.ts') != ''
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        if: hashFiles('client/playwright.config.ts') != ''
        working-directory: client
        run: npx playwright install --with-deps

      - name: Prepare env
        if: hashFiles('client/playwright.config.ts') != ''
        run: cp .env.example .env

      - name: Start dev stack
        if: hashFiles('client/playwright.config.ts') != ''
        run: docker compose --profile dev up -d --build

      - name: Wait for services
        if: hashFiles('client/playwright.config.ts') != ''
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/categories >/dev/null; then echo "server ready"; break; fi
            sleep 5
          done
          curl -sf http://localhost:8080/api/categories
          curl -sf http://localhost:5173 >/dev/null

      - name: Run E2E
        if: hashFiles('client/playwright.config.ts') != ''
        working-directory: client
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: hashFiles('client/playwright.config.ts') != '' && always()
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

      - name: Teardown
        if: always()
        run: docker compose --profile dev down -v