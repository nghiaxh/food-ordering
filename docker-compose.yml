services:
  database:
    image: postgres:18-alpine
    container_name: food-ordering-database
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server-dev:
    build:
      context: ./server
      target: dev
    container_name: food-ordering-server-dev
    profiles: ["dev"]
    depends_on:
      database:
        condition: service_healthy
    environment: &server_env
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      AI_API_KEY: ${AI_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    # tsx watch tự reload khi file đổi; không cần bước compile riêng.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/categories || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - ./server:/app
      - /app/node_modules
      - uploads:/app/uploads

  client-dev:
    build:
      context: ./client
      target: dev
    container_name: food-ordering-client-dev
    profiles: ["dev"]
    depends_on:
      server-dev:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    # Chỉ coi là sẵn sàng khi Vite thật sự phục vụ, tránh client gọi vào backend chưa chạy.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./client:/app
      - /app/node_modules

  server-prod:
    build:
      context: ./server
      target: prod
    container_name: food-ordering-server-prod
    profiles: ["prod"]
    depends_on:
      database:
        condition: service_healthy
    environment: *server_env
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/categories || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  client-prod:
    build:
      context: ./client
      target: prod
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: food-ordering-client-prod
    profiles: ["prod"]
    depends_on:
      server-prod:
        condition: service_healthy
    ports:
      - "80:80"

  drizzle-studio:
    build:
      context: ./server
      target: dev
    container_name: food-ordering-drizzle-studio
    profiles: ["tools"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
    ports:
      - "4983:4983"
    command: ["npx", "drizzle-kit", "studio", "--port", "4983", "--host", "0.0.0.0"]

volumes:
  db_data:
  uploads:
