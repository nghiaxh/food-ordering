services:
  # ---------- Database (dùng chung dev + prod) ----------
  db:
    image: postgres:16-alpine
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- DEV: server hot reload ----------
  server-dev:
    build:
      context: ./server
      target: dev
    profiles: ["dev"]
    depends_on:
      db:
        condition: service_healthy
    environment: &server_env
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - maven_cache:/root/.m2

  # ---------- DEV: client hot reload ----------
  client-dev:
    build:
      context: ./client
      target: dev
    profiles: ["dev"]
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules

  # ---------- PROD: server ----------
  server-prod:
    build:
      context: ./server
      target: prod
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
    environment: *server_env
    ports:
      - "8080:8080"

  # ---------- PROD: client (nginx) ----------
  client-prod:
    build:
      context: ./client
      target: prod
      args:
        VITE_API_URL: http://localhost:8080/api
    profiles: ["prod"]
    depends_on:
      - server-prod
    ports:
      - "80:80"

volumes:
  db_data:
  maven_cache: